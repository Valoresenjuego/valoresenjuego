<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ValoresEnJuego - Bar e Invitados</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .input-premium { @apply w-full p-4 rounded-2xl border border-slate-100 bg-slate-50 text-sm outline-none focus:ring-2 focus:ring-slate-900 transition-all; }
        .btn-accion { @apply p-2 hover:bg-slate-100 rounded-xl transition-all text-xs; }
        .sugerencia-item { @apply p-3 hover:bg-slate-50 cursor-pointer border-b border-slate-50 last:border-none text-xs font-bold flex justify-between items-center; }
        
        /* Ocultar scrollbar en nav móvil */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Contenedor gráfico adaptable */
        .chart-container { position: relative; height: 250px; width: 100%; }
        @media (min-width: 768px) { .chart-container { height: 300px; } }
    </style>
</head>
<body class="text-slate-900">

    <nav class="bg-white border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center">
                    <span class="text-white font-black text-xl">V</span>
                </div>
                <h1 class="text-sm font-black uppercase tracking-tighter hidden sm:block">Valores<span class="text-slate-400">EnJuego</span></h1>
            </div>
            
            <div class="flex gap-4 overflow-x-auto no-scrollbar items-center px-4 flex-1 justify-center sm:justify-end">
                <a href="index.html" class="text-[10px] font-black uppercase tracking-widest text-slate-400 whitespace-nowrap">Socios</a>
                <a href="pagos.html" class="text-[10px] font-black uppercase tracking-widest text-slate-400 whitespace-nowrap">Pagos</a>
                <a href="bar.html" class="text-[10px] font-black uppercase tracking-widest text-slate-900 border-b-2 border-slate-900 pb-1 whitespace-nowrap">Bar</a>
                <a href="gastos.html" class="text-[10px] font-black uppercase tracking-widest text-slate-400 whitespace-nowrap">Gastos</a>
                <a href="balance.html" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 whitespace-nowrap pt-2">Balance</a>
                <button onclick="cerrarSesion()" class="text-[9px] font-black uppercase text-rose-500 whitespace-nowrap">Salir</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
            <div class="md:col-span-2 bg-slate-900 p-6 sm:p-10 rounded-[2rem] text-white shadow-xl relative overflow-hidden">
                <p class="text-[10px] font-black uppercase text-slate-400 mb-2 tracking-widest">Recaudación Total Acumulada</p>
                <h2 id="total-hoy" class="text-3xl sm:text-5xl font-black text-emerald-400">0.00€</h2>
            </div>
            <div class="bg-white p-6 sm:p-8 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col justify-center">
                <p class="text-[10px] font-black uppercase text-slate-400 mb-1 tracking-widest">Estado Sistema</p>
                <h2 id="estado-terminal" class="text-sm font-black text-emerald-500 uppercase flex items-center gap-2">
                    <span class="animate-pulse">●</span> Sincronizado
                </h2>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-5 sm:p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase mb-6 tracking-widest">Evolución de Ingresos</h3>
                <div class="chart-container">
                    <canvas id="graficoMensual"></canvas>
                </div>
            </div>
            <div class="bg-white p-5 sm:p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                <h3 class="text-[10px] font-black text-slate-400 uppercase mb-6 tracking-widest">Resumen por Mes</h3>
                <div id="dashboard-mensual" class="grid grid-cols-2 lg:grid-cols-1 gap-3 max-h-[300px] overflow-y-auto pr-2 no-scrollbar"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-6 sm:p-8 rounded-[2rem] border border-slate-100 shadow-sm h-fit lg:sticky lg:top-24">
                <h3 id="form-titulo" class="text-[10px] font-black text-slate-400 uppercase mb-6 tracking-widest">Registro de Cobro</h3>
                <form id="formBar" class="space-y-4">
                    <select id="tipo" onchange="ajustarTipo()" class="input-premium font-bold">
                        <option value="CONSUMO">🥤 Consumición Bar</option>
                        <option value="INVITADO">👤 Invitado</option>
                    </select>

                    <div class="relative">
                        <input type="text" id="socio_nombre_input" placeholder="Socio que paga..." class="input-premium font-bold" autocomplete="off">
                        <input type="hidden" id="socio_bar">
                        <div id="sugerencias-socios" class="absolute z-50 w-full bg-white mt-1 rounded-xl shadow-xl border border-slate-100 hidden max-h-48 overflow-y-auto"></div>
                    </div>

                    <div id="contenedor-multiplicador" class="hidden animate-in fade-in slide-in-from-top-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Nº de Invitados</label>
                        <input type="number" id="cantidad_invitados" value="1" min="1" oninput="calcularImporteInvitado()" class="input-premium font-black text-center text-lg">
                    </div>

                    <input type="text" id="concepto" placeholder="Concepto" required class="input-premium">
                    
                    <div class="relative">
                        <input type="number" id="importe_bar" step="0.01" placeholder="0.00" required class="input-premium text-2xl font-black text-emerald-600">
                        <span class="absolute right-4 top-4 font-black text-emerald-600">€</span>
                    </div>
                    
                    <div class="space-y-2 pt-2">
                        <button type="submit" id="btn-registrar" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-slate-800 shadow-lg active:scale-95 transition-all">
                            Registrar Cobro
                        </button>
                        <button type="button" id="btn-cancelar" onclick="cancelarEdicion()" class="hidden w-full bg-slate-100 text-slate-500 p-4 rounded-2xl font-black uppercase text-[10px] tracking-widest">
                            Cancelar Edición
                        </button>
                    </div>
                </form>
            </div>

            <div id="lista-pagos-bar" class="lg:col-span-2 space-y-3 pb-20"></div>
        </div>
    </main>

    <script>
        const SB_URL = "https://xegikxovbjttailnassr.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZ2lreG92Ymp0dGFpbG5hc3NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MDA1OTMsImV4cCI6MjA5MzM3NjU5M30.tufFxLYUJ8wdDsFtWW4wL7Z1w3TMeUw3CRbNkHSp58w";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let todosLosPagos = [];
        let listaSocios = [];
        let sociosActivos = [];
        let miGrafico = null;
        let editandoID = null;

        async function validarAcceso() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
            } else {
                cargarDatos();
            }
        }

        async function cerrarSesion() {
            await _supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        async function cargarDatos() {
            const [respPagos, respSocios] = await Promise.all([
                _supabase.from('pagos_bar').select('*').order('fecha', { ascending: true }),
                _supabase.from('socios').select('num_socio, nombre, apellidos, estado')
            ]);
            
            if (!respSocios.error) {
                listaSocios = respSocios.data;
                sociosActivos = respSocios.data.filter(s => s.estado !== 'BAJA');
            }

            if (!respPagos.error) {
                todosLosPagos = respPagos.data;
                actualizarTotal(todosLosPagos);
                actualizarDashboardYGrafico(todosLosPagos);
                renderizarLista([...todosLosPagos].reverse());
            }
        }

        function actualizarTotal(datos) {
            const total = datos.reduce((acc, p) => acc + (Number(p.importe) || 0), 0);
            document.getElementById('total-hoy').innerText = total.toFixed(2) + "€";
        }

        function actualizarDashboardYGrafico(datos) {
            const totalesPorMes = {};
            datos.forEach(p => {
                const fecha = new Date(p.fecha);
                const mesAnio = fecha.toLocaleString('es-ES', { month: 'short', year: '2-digit' }).toUpperCase();
                totalesPorMes[mesAnio] = (totalesPorMes[mesAnio] || 0) + (Number(p.importe) || 0);
            });

            const etiquetas = Object.keys(totalesPorMes);
            const valores = Object.values(totalesPorMes);

            document.getElementById('dashboard-mensual').innerHTML = etiquetas.map((mes, i) => `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center">
                    <p class="text-[9px] font-black uppercase text-slate-400">${mes}</p>
                    <p class="text-sm font-black text-slate-900">${valores[i].toFixed(2)}€</p>
                </div>
            `).reverse().join('');

            const ctx = document.getElementById('graficoMensual').getContext('2d');
            if (miGrafico) miGrafico.destroy();
            miGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: etiquetas,
                    datasets: [{ data: valores, backgroundColor: '#0f172a', borderRadius: 8 }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, ticks: { font: { size: 10 } } },
                        x: { ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        function renderizarLista(datos) {
            const cont = document.getElementById('lista-pagos-bar');
            cont.innerHTML = datos.map(p => `
                <div class="bg-white p-4 sm:p-5 rounded-3xl border border-slate-100 flex justify-between items-center group transition-all hover:shadow-md">
                    <div class="flex items-center gap-3 sm:gap-4">
                        <div class="w-10 h-10 shrink-0 ${p.tipo === 'INVITADO' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600'} rounded-2xl flex items-center justify-center text-lg">
                            ${p.tipo === 'INVITADO' ? '👤' : '🥤'}
                        </div>
                        <div class="min-w-0">
                            <p class="text-xs sm:text-sm font-bold text-slate-800 truncate">${p.concepto}</p>
                            <p class="text-[9px] font-black uppercase text-slate-400 truncate">
                                ${obtenerNombreSocio(p.num_socio)} • ${new Date(p.fecha).toLocaleDateString()}
                            </p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 sm:gap-2">
                        <p class="text-sm sm:text-lg font-black whitespace-nowrap">${Number(p.importe).toFixed(2)}€</p>
                        <div class="flex sm:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="prepararEdicion(${p.id})" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg">✏️</button>
                            <button onclick="eliminarPago(${p.id})" class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function obtenerNombreSocio(num) {
            const s = listaSocios.find(x => x.num_socio == num);
            return s ? s.nombre : (num ? `#${num}` : "Venta Directa");
        }

        // --- LÓGICA BUSCADOR ---
        const inputSocio = document.getElementById('socio_nombre_input');
        const sugerencias = document.getElementById('sugerencias-socios');
        const hiddenId = document.getElementById('socio_bar');

        inputSocio.addEventListener('input', (e) => {
            const t = e.target.value.toLowerCase();
            if (t.length < 1) { sugerencias.classList.add('hidden'); return; }
            const filtrados = sociosActivos.filter(s => s.nombre.toLowerCase().includes(t) || s.num_socio.toString().includes(t)).slice(0,5);
            if (filtrados.length > 0) {
                sugerencias.innerHTML = filtrados.map(s => `
                    <div class="sugerencia-item" onclick="seleccionarSocio(${s.num_socio}, '${s.nombre} ${s.apellidos}')">
                        <span>${s.nombre} ${s.apellidos}</span>
                        <span class="opacity-30">#${s.num_socio}</span>
                    </div>
                `).join('');
                sugerencias.classList.remove('hidden');
            } else { sugerencias.classList.add('hidden'); }
        });

        function seleccionarSocio(num, nombre) {
            inputSocio.value = nombre;
            hiddenId.value = num;
            sugerencias.classList.add('hidden');
        }

        function ajustarTipo() {
            const tipo = document.getElementById('tipo').value;
            const container = document.getElementById('contenedor-multiplicador');
            container.classList.toggle('hidden', tipo !== 'INVITADO');
            if(tipo === 'CONSUMO') {
                document.getElementById('concepto').value = "";
                document.getElementById('importe_bar').value = "";
            }
        }

        function calcularImporteInvitado() {
            const cant = parseInt(document.getElementById('cantidad_invitados').value) || 1;
            document.getElementById('importe_bar').value = (cant * 3.00).toFixed(2);
            document.getElementById('concepto').value = `Acceso Invitado (${cant})`;
        }

        // --- CRUD ---
document.getElementById('formBar').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-registrar');
    btn.disabled = true;
    btn.innerText = "Procesando...";

    // Forzar el valor del socio. Si el campo de texto está vacío, nos aseguramos de que no envíe id antiguo
    const socioInputVal = document.getElementById('socio_nombre_input').value.trim();
    const hiddenIdVal = document.getElementById('socio_bar').value;

    const data = {
        tipo: document.getElementById('tipo').value,
        num_socio: (socioInputVal && hiddenIdVal) ? parseInt(hiddenIdVal) : null,
        concepto: document.getElementById('concepto').value,
        importe: parseFloat(document.getElementById('importe_bar').value)
    };

    try {
        let res;
        if (editandoID) {
            res = await _supabase.from('pagos_bar').update(data).eq('id', editandoID);
        } else {
            res = await _supabase.from('pagos_bar').insert([data]);
        }

        if (!res.error) { 
            cancelarEdicion(); 
            await cargarDatos(); 
        } else {
            alert("Error al guardar: " + res.error.message);
        }
    } catch (err) {
        console.error(err);
        alert("Error crítico en la conexión.");
    } finally {
        // Esto asegura que el botón SIEMPRE se vuelva a activar si algo falla
        btn.disabled = false;
        if (!editandoID) {
            btn.innerText = "Registrar Cobro";
        } else {
            btn.innerText = "Guardar Cambios";
        }
    }
};

function prepararEdicion(id) {
    const p = todosLosPagos.find(item => item.id === id);
    if(!p) return;
    
    editandoID = id;
    document.getElementById('tipo').value = p.tipo;
    document.getElementById('socio_bar').value = p.num_socio || "";
    
    // Cambiado aquí: Buscamos el socio para pintar Nombre + Apellidos completo en el input visual
    if (p.num_socio) {
        const s = listaSocios.find(x => x.num_socio == p.num_socio);
        document.getElementById('socio_nombre_input').value = s ? `${s.nombre} ${s.apellidos}` : `#${p.num_socio}`;
    } else {
        document.getElementById('socio_nombre_input').value = "";
    }
    
    document.getElementById('concepto').value = p.concepto;
    document.getElementById('importe_bar').value = p.importe;
    document.getElementById('form-titulo').innerText = "Editando Registro";
    document.getElementById('btn-registrar').innerText = "Guardar Cambios";
    document.getElementById('btn-cancelar').classList.remove('hidden');
    
    // Ejecutamos ajustarTipo pero SIN vaciar los datos que acabamos de cargar
    const tipo = p.tipo;
    const container = document.getElementById('contenedor-multiplicador');
    container.classList.toggle('hidden', tipo !== 'INVITADO');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function eliminarPago(id) {
    if (!confirm("¿Seguro que quieres eliminar este registro?")) return;

    try {
        const res = await _supabase.from('pagos_bar').delete().eq('id', id);
        if (!res.error) {
            await cargarDatos();
        } else {
            alert("Error al eliminar: " + res.error.message);
        }
    } catch (err) {
        console.error(err);
        alert("Error crítico en la conexión.");
    }
}

function cancelarEdicion() {
    editandoID = null;
    document.getElementById('formBar').reset();
    document.getElementById('socio_bar').value = "";
    document.getElementById('form-titulo').innerText = "Registro de Cobro";
    document.getElementById('btn-registrar').innerText = "Registrar Cobro";
    document.getElementById('btn-cancelar').classList.add('hidden');
    
    // Oculta el multiplicador manualmente para evitar el trigger de limpiar campos de ajustarTipo()
    document.getElementById('contenedor-multiplicador').classList.add('hidden');
}

        window.onload = validarAcceso;
    </script>
</body>
</html>
