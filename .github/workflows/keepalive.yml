name: Supabase Keepalive

on:
  schedule:
    # Se ejecuta cada 3 días a las 05:00 UTC
    - cron: '0 5 */3 * *'
  workflow_dispatch: # permite lanzarlo manualmente desde la pestaña Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase para generar actividad
        run: |
          curl -s -X GET \
            "https://xegikxovbjttailnassr.supabase.co/rest/v1/socios?select=num_socio&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
