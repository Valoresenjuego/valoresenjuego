<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Área - Valores en Juego</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white border-b border-slate-100">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">

            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-slate-900 rounded-xl flex items-center justify-center">
                    <span class="text-white font-black text-xl">V</span>
                </div>

                <div>
                    <h1 class="text-sm font-black uppercase tracking-tight">
                        Valores<span class="text-slate-400">EnJuego</span>
                    </h1>
                    <p class="text-[8px] text-slate-400 font-bold uppercase tracking-widest">
                        Área del socio
                    </p>
                </div>
            </div>

            <button
                onclick="cerrarSesion()"
                class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-[9px] font-black uppercase tracking-widest">
                Salir
            </button>

        </div>
    </header>


    <main class="max-w-3xl mx-auto p-4 md:p-8">

        <div id="cargando" class="bg-white rounded-[2rem] p-8 text-center shadow-sm">
            <p class="text-xs font-black uppercase text-slate-400">
                Cargando tu área...
            </p>
        </div>


        <div id="contenido" class="hidden space-y-6">

            <!-- BIENVENIDA -->
            <section class="bg-slate-900 rounded-[2rem] p-7 text-white shadow-xl">

                <p class="text-[9px] font-black uppercase tracking-widest text-slate-400">
                    Bienvenido
                </p>

                <h2 id="nombre-socio"
                    class="text-3xl font-black tracking-tight mt-2">
                </h2>

                <p class="text-slate-400 text-xs font-bold uppercase mt-2">
                    Socio nº <span id="numero-socio"></span>
                </p>

            </section>


            <!-- CUENTA DEL MES -->
            <section class="bg-white rounded-[2rem] p-7 border border-slate-100 shadow-sm">

                <p class="text-[9px] font-black uppercase tracking-widest text-slate-400">
                    Cuenta del mes
                </p>

                <div class="mt-5 grid grid-cols-2 gap-3">

                    <div class="bg-slate-50 rounded-2xl p-5">
                        <p class="text-[8px] font-black uppercase text-slate-400">
                            Cuota
                        </p>

                        <p class="text-2xl font-black mt-1">
                            20,00 €
                        </p>
                    </div>

                    <div class="bg-emerald-50 rounded-2xl p-5">
                        <p class="text-[8px] font-black uppercase text-emerald-600">
                            Bar
                        </p>

                        <p id="total-bar"
                           class="text-2xl font-black text-emerald-600 mt-1">
                            0,00 €
                        </p>
                    </div>

                </div>

                <div class="mt-4 bg-slate-900 rounded-2xl p-5 text-white flex justify-between items-center">

                    <span class="text-[9px] font-black uppercase tracking-widest">
                        Total del mes
                    </span>

                    <span id="total-mes"
                          class="text-2xl font-black">
                        20,00 €
                    </span>

                </div>

            </section>


            <!-- PRÓXIMAMENTE -->
            <section class="bg-white rounded-[2rem] p-7 border border-slate-100 shadow-sm">

                <p class="text-[9px] font-black uppercase tracking-widest text-slate-400">
                    Consumos
                </p>

                <div class="mt-5 bg-slate-50 rounded-2xl p-6 text-center">

                    <div class="text-3xl mb-3">🍺</div>

                    <p class="font-black text-sm">
                        Registro de consumos
                    </p>

                    <p class="text-xs text-slate-400 font-bold mt-1">
                        Próximamente podrás apuntar aquí tus consumiciones del bar.
                    </p>

                </div>

            </section>

        </div>

    </main>


<script>

    const SB_URL = "https://xegikxovbjttailnassr.supabase.co";

    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzc3ODAwNTkzLCJleHAiOjIwOTMzNzY1OTN9.tufFxLYUJ8wdDsFtWW4wL7Z1w3TMeUw3CRbNkHSp58w";

    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);


    async function comprobarAcceso() {

        const {
            data: { session },
            error: sessionError
        } = await supabaseClient.auth.getSession();


        if (sessionError || !session) {
            window.location.href = 'index.html';
            return;
        }


        const { data, error } = await supabaseClient
            .from('usuarios_socios')
            .select('rol, activo, num_socio')
            .eq('id', session.user.id)
            .single();


        if (error || !data || !data.activo) {

            await supabaseClient.auth.signOut();

            window.location.href = 'index.html';

            return;
        }


        /*
         * Un administrador no debe utilizar socio.html.
         * Si entra aquí, lo devolvemos al panel.
         */
        if (data.rol === 'admin') {

            window.location.href = 'index.html';

            return;
        }


        if (data.rol !== 'socio') {

            await supabaseClient.auth.signOut();

            window.location.href = 'index.html';

            return;
        }


        await cargarDatosSocio(data.num_socio);
    }


    async function cargarDatosSocio(numSocio) {

        const { data: socio, error } = await supabaseClient
            .from('socios')
            .select('nombre, apellidos, num_socio')
            .eq('num_socio', numSocio)
            .single();


        if (error || !socio) {

            document.getElementById('cargando').innerHTML =
                '<p class="text-sm font-black text-rose-600">No se ha podido cargar tu ficha.</p>';

            return;
        }


        document.getElementById('nombre-socio').textContent =
            `${socio.nombre} ${socio.apellidos}`;

        document.getElementById('numero-socio').textContent =
            socio.num_socio;


        /*
         * De momento solamente mostramos la cuota.
         * El total del bar lo conectaremos en el siguiente paso.
         */

        document.getElementById('total-bar').textContent = '0,00 €';

        document.getElementById('total-mes').textContent = '20,00 €';


        document.getElementById('cargando').classList.add('hidden');

        document.getElementById('contenido').classList.remove('hidden');
    }


    async function cerrarSesion() {

        await supabaseClient.auth.signOut();

        window.location.href = 'index.html';
    }


    window.onload = comprobarAcceso;

</script>

</body>
</html>
